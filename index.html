<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h2>Busca de Pokémon</h2>
        <input type="text" id="campoBusca"
        placeholder="Digite o nome do Pokemon...">
        <button id="btnBuscar">Pesquisar</button>
        <div id="resultado" class="escondido">
            <img id="PokeImg" src="" alt="Imagem do pokemon">
            <h3 id="pokeNome"><h3>
            <p><strong>ID:</strong><span id="pokeID"></span></p>
            <p><strong>Altura:</strong><span id="pokeID"></span></p>
            <p><strong>Peso:</strong><span id="pokeID"></span></p>
            <p><strong>Tipo:</strong>:</strong><span id="pokeID"></span></p>
        </div>
        <div id="msgErro" class="escondido">
            Pokemon não encontrado, tente de novo.
        </div>


    </div>
</body>
</html>
